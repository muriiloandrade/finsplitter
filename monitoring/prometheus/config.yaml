global:
    scrape_interval: 15s
    evaluation_interval: 15s
    external_labels:
        cluster: finsplitter
        environment: local

scrape_configs:
    - job_name: "finsplitter-api"
      static_configs:
          - targets: ["finsplitter:3033"]
            labels:
                service: "api"

    - job_name: "otel-collector"
      static_configs:
          - targets: ["otel-collector:8888"]
            labels:
                service: "otel-collector"

    - job_name: "otel-collector-metrics"
      static_configs:
          - targets: ["otel-collector:8889"]
            labels:
                service: "otel-collector-metrics"

    - job_name: "tempo"
      static_configs:
          - targets: ["tempo:3200"]
            labels:
                service: "tempo"

    - job_name: "loki"
      static_configs:
          - targets: ["loki:3100"]
            labels:
                service: "loki"

    - job_name: "prometheus"
      static_configs:
          - targets: ["localhost:9090"]
            labels:
                service: "prometheus"
