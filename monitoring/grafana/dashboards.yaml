apiVersion: 1

providers:
    - name: "Finsplitter Dashboards"
      orgId: 1
      folder: "Finsplitter"
      type: file
      disableDeletion: false
      editable: true
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true
