apiVersion: 1

datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://host.docker.internal:9090
      isDefault: false
      editable: true
      jsonData:
          httpMethod: POST
          timeInterval: 15s

    - name: Tempo
      type: tempo
      access: proxy
      url: http://host.docker.internal:3200
      isDefault: false
      editable: true
      jsonData:
          httpMethod: GET
          tracesToLogs:
              datasourceUid: loki
              tags: ["job", "instance", "pod", "namespace"]
              mappedTags: [{ key: "service.name", value: "service" }]
              mapTagNamesEnabled: true
              spanStartTimeShift: "-1h"
              spanEndTimeShift: "1h"
              filterByTraceID: true
              filterBySpanID: false
          tracesToMetrics:
              datasourceUid: prometheus
              tags: [{ key: "service.name", value: "service" }]
              queries:
                  - name: "Request Rate"
                    query: "rate(traces_spanmetrics_calls_total{$__tags}[5m])"
          serviceMap:
              datasourceUid: prometheus
          nodeGraph:
              enabled: true
          search:
              hide: false
          lokiSearch:
              datasourceUid: loki

    - name: Loki
      type: loki
      access: proxy
      url: http://host.docker.internal:3100
      isDefault: false
      editable: true
      jsonData:
          httpMethod: POST
          maxLines: 1000
          derivedFields:
              - datasourceUid: tempo
                matcherRegex: "trace_id=(\\w+)"
                name: TraceID
                url: "$${__value.raw}"

    - name: Finsplitter Observability
      type: tempo
      access: proxy
      url: http://host.docker.internal:3200
      isDefault: true
      editable: true
      uid: finsplitter-main
      jsonData:
          httpMethod: GET
          tracesToLogs:
              datasourceUid: loki
              tags: ["service.name", "http.method", "http.route"]
              mappedTags: [{ key: "service.name", value: "service" }]
              mapTagNamesEnabled: true
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              filterByTraceID: true
          tracesToMetrics:
              datasourceUid: prometheus
              tags: [{ key: "service.name", value: "service" }]
              queries:
                  - name: "Request Rate"
                    query: "sum(rate(finsplitter_http_server_duration_count{$__tags}[5m]))"
                  - name: "Error Rate"
                    query: 'sum(rate(finsplitter_http_server_duration_count{$__tags,status_code=~"5.."}[5m]))'
                  - name: "Duration p95"
                    query: "histogram_quantile(0.95, sum(rate(finsplitter_http_server_duration_bucket{$__tags}[5m])) by (le))"
          serviceMap:
              datasourceUid: prometheus
          nodeGraph:
              enabled: true
          search:
              hide: false
          lokiSearch:
              datasourceUid: loki
