---
services:
    postgresql:
        profiles:
            - infra
        image: postgres:18.1-trixie@sha256:c1f0abd909b477d6088c72e4cd6eb01ea525344caca1b58689ae884204369502
        container_name: finsplitter-db
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}",
                ]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 5s
        volumes:
            - database:/var/lib/postgresql
        ports:
            - ${PG_PORT:-5432}:5432
        environment:
            POSTGRES_PASSWORD: ${PG_PASS:?database password required}
            POSTGRES_USER: ${PG_USER:-finsplitter}
            POSTGRES_DB: ${PG_DB:-finsplitter}
        env_file:
            - .env
        networks:
            - finsplitter

volumes:
    database:
        driver: local
