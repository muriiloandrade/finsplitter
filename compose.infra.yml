---
services:
  postgresql:
    profiles:
      - infra
    image: postgres:18.0-trixie@sha256:41fc5342eefba6cc2ccda736aaf034bbbb7c3df0fdb81516eba1ba33f360162c
    container_name: finsplitter-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - ${PG_PORT:-5432}:5432
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-finsplitter}
      POSTGRES_DB: ${PG_DB:-finsplitter}
    env_file:
      - .env
    networks:
      - finsplitter

volumes:
  database:
    driver: local
