---
services:
    postgresql:
        profiles:
            - infra
        image: postgres:18.4-trixie@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
        container_name: finsplitter-db
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}",
                ]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 5s
        volumes:
            - database:/var/lib/postgresql
        ports:
            - ${PG_PORT:-5432}:5432
        environment:
            POSTGRES_PASSWORD: ${PG_PASS:?database password required}
            POSTGRES_USER: ${PG_USER:-finsplitter}
            POSTGRES_DB: ${PG_DB:-finsplitter}
        env_file:
            - .env
        networks:
            - finsplitter

    valkey:
        profiles:
            - infra
        image: valkey/valkey:9.1.0-trixie@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
        container_name: finsplitter-valkey
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            start_period: 5s
            interval: 10s
            retries: 5
            timeout: 3s
        ports:
            - "${VALKEY_PORT:-6379}:6379"
        networks:
            - finsplitter
        volumes:
            - valkey-data:/data

volumes:
    database:
        driver: local
    valkey-data:
        driver: local
