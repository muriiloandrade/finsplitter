---
services:
    postgresql:
        profiles:
            - infra
        image: postgres:19.0-trixie@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
        container_name: finsplitter-db
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}",
                ]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 5s
        volumes:
            - database:/var/lib/postgresql
        ports:
            - ${PG_PORT:-5432}:5432
        environment:
            POSTGRES_PASSWORD: ${PG_PASS:?database password required}
            POSTGRES_USER: ${PG_USER:-finsplitter}
            POSTGRES_DB: ${PG_DB:-finsplitter}
        env_file:
            - .env
        networks:
            - finsplitter

    valkey:
        profiles:
            - infra
        image: valkey/valkey:9.2.0-trixie@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
        container_name: finsplitter-valkey
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            start_period: 5s
            interval: 10s
            retries: 5
            timeout: 3s
        ports:
            - "${VALKEY_PORT:-6379}:6379"
        networks:
            - finsplitter
        volumes:
            - valkey-data:/data

volumes:
    database:
        driver: local
    valkey-data:
        driver: local
