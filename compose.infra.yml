---
services:
    postgresql:
        profiles:
            - infra
        image: postgres:18.6-trixie@sha256:ae6c78831cbc35fa3a4aaf4d763ddacf6183d6004774cc2dc28b3920410d1d1a
        container_name: finsplitter-db
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}",
                ]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 5s
        volumes:
            - database:/var/lib/postgresql
        ports:
            - ${PG_PORT:-5432}:5432
        environment:
            POSTGRES_PASSWORD: ${PG_PASS:?database password required}
            POSTGRES_USER: ${PG_USER:-finsplitter}
            POSTGRES_DB: ${PG_DB:-finsplitter}
        env_file:
            - .env
        networks:
            - finsplitter

    valkey:
        profiles:
            - infra
        image: valkey/valkey:9.1.1-trixie@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
        container_name: finsplitter-valkey
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            start_period: 5s
            interval: 10s
            retries: 5
            timeout: 3s
        ports:
            - "${VALKEY_PORT:-6379}:6379"
        networks:
            - finsplitter
        volumes:
            - valkey-data:/data

volumes:
    database:
        driver: local
    valkey-data:
        driver: local
