codecov:
    branch: main
    notify:
        wait_for_ci: false

comment:
    layout: "diff, flags, files"
    behavior: default
    require_changes: true
    require_base: false
    require_head: true
    hide_project_coverage: false

github_checks:
    annotations: false

coverage:
    status:
        project:
            default:
                informational: true
        patch:
            default:
                informational: true
# When modifying this file, please validate using
# curl -X POST --data-binary @codecov.yml https://codecov.io/validate
