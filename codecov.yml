codecov:
    branch: main
    notify:
        wait_for_ci: false

comment:
    layout: "diff, flags, files"
    behavior: default
    require_changes: true
    require_base: false
    require_head: true
    hide_project_coverage: false

github_checks:
    annotations: false

coverage:
    range: 50..80
    round: down
    precision: 1
    status:
        project:
            default:
                informational: true
                paths:
                    - "!**/mocks.gen.go"
        patch:
            default:
                informational: true
                paths:
                    - "!**/mocks.gen.go"

ignore:
    - "**/*mocks.gen.go"
# When modifying this file, please validate using
# curl -X POST --data-binary @codecov.yml https://codecov.io/validate
