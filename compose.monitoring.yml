services:
    otel:
        profiles:
            - monitoring
        container_name: finsplitter-lgtm
        image: grafana/otel-lgtm:0.29.0@sha256:6e14b923e0130b8b294ca5bcc7c94d54e899d150817e6c3ed82d9b665afe5499
        networks:
            - finsplitter
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "3000:3000"
            - "4317:4317"
            - "4318:4318"
            - "9090:9090"
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
            - GF_SECURITY_ALLOW_EMBEDDING=true
