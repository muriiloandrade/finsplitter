services:
    otel:
        profiles:
            - monitoring
        container_name: finsplitter-lgtm
        image: grafana/otel-lgtm:0.19.1@sha256:47bda08f5cbfe1096ce2a146ab46b2d1331b654f9037c9797cfe77363ead8078
        networks:
            - finsplitter
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "3000:3000"
            - "4317:4317"
            - "4318:4318"
            - "9090:9090"
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
            - GF_SECURITY_ALLOW_EMBEDDING=true
