services:
    otel:
        profiles:
            - monitoring
        container_name: finsplitter-lgtm
        image: grafana/otel-lgtm:0.34.0@sha256:b966ea107831d526d9eb8fe4d2d86c9e5731392fad9dce8296bcf2072031f07c
        networks:
            - finsplitter
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "3000:3000"
            - "4317:4317"
            - "4318:4318"
            - "9090:9090"
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
            - GF_SECURITY_ALLOW_EMBEDDING=true
