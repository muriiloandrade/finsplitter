services:
    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.139.0@sha256:faf125d656fa47cea568b2f3b4494efd2525083bc75c1e96038bc23f05cd68fd
        container_name: finsplitter-otel-collector
        profiles:
            - monitoring
        command: ["--config=/etc/otelcol-contrib/config.yaml"]
        volumes:
            - ./monitoring/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
        ports:
            - "4317:4317" # OTLP gRPC receiver
            - "4318:4318" # OTLP HTTP receiver
            - "8888:8888" # Prometheus metrics exposed by the collector
            - "8889:8889" # Prometheus exporter metrics
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - finsplitter-net
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    tempo:
        image: grafana/tempo:2.9.0@sha256:65a5789759435f1ef696f1953258b9bbdb18eb571d5ce711ff812d2e128288a4
        container_name: finsplitter-tempo
        profiles:
            - monitoring
        command: ["-config.file=/etc/tempo.yaml"]
        volumes:
            - ./monitoring/tempo/config.yaml:/etc/tempo.yaml:ro
            - tempo-data:/var/tempo
        ports:
            - "3200:3200" # Tempo HTTP
            - "4317" # OTLP gRPC receiver
            - "4318" # OTLP HTTP receiver
        networks:
            - finsplitter-net
        restart: unless-stopped
        healthcheck:
            test:
                ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    loki:
        image: grafana/loki:3.5.8@sha256:00981fd9455db8589c3aa6d06744af3138c4b2c32fdec62101e92c7a704b2642
        container_name: finsplitter-loki
        profiles:
            - monitoring
        command: ["-config.file=/etc/loki/config.yaml"]
        volumes:
            - ./monitoring/loki/config.yaml:/etc/loki/config.yaml:ro
            - loki-data:/loki
        ports:
            - "3100:3100" # Loki HTTP
            - "9096:9096" # Loki gRPC
        networks:
            - finsplitter-net
        restart: unless-stopped
        healthcheck:
            test:
                ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    prometheus:
        image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
        container_name: finsplitter-prometheus
        profiles:
            - monitoring
        command:
            - "--config.file=/etc/prometheus/prometheus.yaml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
            - "--web.enable-lifecycle"
        volumes:
            - ./monitoring/prometheus/config.yaml:/etc/prometheus/prometheus.yaml:ro
            - prometheus-data:/prometheus
        ports:
            - "9090:9090" # Prometheus UI
        networks:
            - finsplitter-net
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://localhost:9090/-/healthy",
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    grafana:
        image: grafana/grafana:12.2.1@sha256:35c41e0fd0295f5d0ee5db7e780cf33506abfaf47686196f825364889dee878b
        container_name: finsplitter-grafana
        profiles:
            - monitoring
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
            - GF_AUTH_DISABLE_LOGIN_FORM=true
            - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
            - GF_INSTALL_PLUGINS=grafana-clock-panel
        volumes:
            - ./monitoring/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
            - ./monitoring/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
            - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana-data:/var/lib/grafana
        ports:
            - "3000:3000" # Grafana UI
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - finsplitter-net
        restart: unless-stopped
        depends_on:
            - tempo
            - loki
            - prometheus
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://localhost:3000/api/health",
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s

volumes:
    tempo-data:
        name: finsplitter-tempo-data
    loki-data:
        name: finsplitter-loki-data
    prometheus-data:
        name: finsplitter-prometheus-data
    grafana-data:
        name: finsplitter-grafana-data
