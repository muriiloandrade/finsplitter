name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
    - title: "🚀 Features"
      semver-increment: "minor"
      when:
        labels:
            - "feature"
            - "enhancement"
            - "feat"
            - "minor"
    - title: "🐛 Bug Fixes"
      when:
        labels:
            - "fix"
            - "bugfix"
            - "bug"
    - title: "🧰 Maintenance"
      when:
        labels:
            - "chore"
            - "ci"
            - "refactor"
            - "perf"
            - "build"
    - title: "📚 Documentation"
      when:
        labels:
            - "documentation"
            - "docs"
    - title: "🔒 Security"
      when:
        labels:
            - "security"
    - title: "⚡ Performance Improvements"
      when:
        labels:
            - "performance"
            - "perf"
    - title: "🛠️ Dependencies"
      when:
        labels:
            - "dependencies"
            - "deps"
    - type: "pre-exclude"
      when:
        label: "skip-changelog"
    - type: "version-resolver"
      semver-increment: "major"
      when:
        labels:
            - "major"
            - "breaking"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"

change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.

autolabeler:
    - label: "feature"
      title:
          - '/^feat(\(.+\))?: .+/'
    - label: "bug"
      title:
          - '/^fix(\(.+\))?: .+/'
    - label: "chore"
      title:
          - '/^chore(\(.+\))?: .+/'
    - label: "ci"
      title:
          - '/^ci(\(.+\))?: .+/'
    - label: "docs"
      title:
          - '/^docs(\(.+\))?: .+/'
    - label: "refactor"
      title:
          - '/^refactor(\(.+\))?: .+/'
    - label: "perf"
      title:
          - '/^perf(\(.+\))?: .+/'
    - label: "build"
      title:
          - '/^build(\(.+\))?: .+/'
    - label: "dependencies"
      branch:
          - '/renovate\/.+/'
          - '/dependabot\/.+/'
      title:
          - '/^deps(\(.+\))?: .+/'
          - '/^build\(deps\): .+/'
    - label: "breaking"
      title:
          - "/^.+!: .+/"
          - "/BREAKING CHANGE/"
    - label: "security"
      title:
          - '/^security(\(.+\))?: .+/'
          - "/security/i"

template: |
    ## Changes

    $CHANGES

    ## Contributors

    Thanks to all contributors who made this release possible! 🎉

    $CONTRIBUTORS

footer: |
    **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
