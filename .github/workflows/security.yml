name: Security Scan

on:
    workflow_call:
        inputs:
            go-versions:
                description: "Go versions to scan with (JSON array)"
                required: false
                default: '["1.27"]'
                type: string
            gosec-args:
                description: "Arguments for Gosec"
                required: false
                default: "-no-fail -fmt sarif -out gosec-results.sarif ./..."
                type: string

jobs:
    # Gosec Security Scanner Job (quick scan)
    gosec:
        name: Gosec Security Scan
        runs-on: "ubuntu-latest"
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read
        strategy:
            matrix:
                go-version: ${{ fromJSON(inputs.go-versions) }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: true

            - name: Run Gosec Security Scanner
              uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
              with:
                  args: ${{ inputs.gosec-args }}

            - name: Upload SARIF file
              uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  sarif_file: gosec-results.sarif

    # CodeQL Analysis Jobs (thorough scan)
    codeql:
        name: CodeQL Analysis (${{ matrix.language }})
        runs-on: "ubuntu-latest"
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read

        strategy:
            fail-fast: false
            matrix:
                go-version: ${{ fromJSON(inputs.go-versions) }}
                include:
                    - language: actions
                      build-mode: none
                    - language: go
                      build-mode: autobuild

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: true

            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  queries: security-and-quality

            # If the analyze step fails for one of the languages you are analyzing with
            # "We were unable to automatically build your code", modify the matrix above
            # to set the build mode to "manual" for that language. Then modify this step
            # to build your code.
            # ℹ️ Command-line programs to run using the OS shell.
            # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
            - name: Run manual build steps
              if: matrix.build-mode == 'manual'
              shell: bash
              run: |
                  echo 'If you are using a "manual" build mode for one or more of the' \
                      'languages you are analyzing, replace this with the commands to build' \
                      'your code, for example:'
                  echo '  make bootstrap'
                  echo '  make release'
                  exit 1

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  category: "/language:${{matrix.language}}"
