name: Security Scan

on:
    workflow_call:
        inputs:
            go-versions:
                description: "Go versions to scan with (JSON array)"
                required: false
                default: '["1.26"]'
                type: string
            gosec-args:
                description: "Arguments for Gosec"
                required: false
                default: "-no-fail -fmt sarif -out gosec-results.sarif ./..."
                type: string

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: "ubuntu-latest"
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read
        env:
            GOEXPERIMENT: jsonv2

        strategy:
            fail-fast: false
            matrix:
                go-version: ${{ fromJSON(inputs.go-versions) }}
                include:
                    - language: actions
                      build-mode: none
                    - language: go
                      build-mode: autobuild
        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Set up Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: true

            - name: Run Gosec Security Scanner
              uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
              env:
                  GOEXPERIMENT: jsonv2
              with:
                  args: ${{ inputs.gosec-args }}

            - name: Upload SARIF file
              uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
              with:
                  sarif_file: gosec-results.sarif

            - name: Initialize CodeQL
              uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  queries: security-and-quality

            # If the analyze step fails for one of the languages you are analyzing with
            # "We were unable to automatically build your code", modify the matrix above
            # to set the build mode to "manual" for that language. Then modify this step
            # to build your code.
            # ℹ️ Command-line programs to run using the OS shell.
            # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
            - name: Run manual build steps
              if: matrix.build-mode == 'manual'
              shell: bash
              run: |
                  echo 'If you are using a "manual" build mode for one or more of the' \
                      'languages you are analyzing, replace this with the commands to build' \
                      'your code, for example:'
                  echo '  make bootstrap'
                  echo '  make release'
                  exit 1

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
              with:
                  category: "/language:${{matrix.language}}"
