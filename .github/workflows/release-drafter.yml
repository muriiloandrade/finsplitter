name: Release Drafter

on:
    workflow_call:
        inputs:
            labeler-only:
                description: "Run in labeler-only mode (disable release notes generation)"
                required: false
                default: false
                type: boolean

permissions:
    contents: write
    pull-requests: write

jobs:
    update_release_draft:
        runs-on: ubuntu-latest
        steps:
            - uses: release-drafter/release-drafter@139054aeaa9adc52ab36ddf67437541f039b88e2 # v7.1.1
              with:
                  config-name: release-drafter.yml
                  disable-releaser: ${{ inputs.labeler-only }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
