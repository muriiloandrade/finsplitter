name: Release Drafter

on:
    workflow_call:
        inputs:
            labeler-only:
                description: "Run in labeler-only mode (disable release notes generation)"
                required: false
                default: false
                type: boolean

permissions:
    contents: write
    pull-requests: write

jobs:
    update_release_draft:
        runs-on: ubuntu-latest
        steps:
            - uses: release-drafter/release-drafter@b1476f6e6eb133afa41ed8589daba6dc69b4d3f5 # v6.1.0
              with:
                  config-name: release-drafter.yml
                  disable-releaser: ${{ inputs.labeler-only }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
