name: Prerequisites Check

on:
    workflow_call:
        inputs:
            go-versions:
                description: "Go versions to check (JSON array)"
                required: false
                default: '["1.26"]'
                type: string

jobs:
    checks:
        name: Prerequisites Check (Go ${{ matrix.go-version }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            matrix:
                go-version: ${{ fromJSON(inputs.go-versions) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: true

            - name: Verify dependencies
              run: GOEXPERIMENT=jsonv2 go mod verify

            - name: Verify go mod tidy
              run: |
                  GOEXPERIMENT=jsonv2 go mod tidy
                  test -z "$(git status --porcelain go.mod go.sum)"

            - name: Verify SQLC generation
              run: |
                  make generate-sqlc
                  test -z "$(git status --porcelain internal/gateways/postgres/sqlc/)"

            - name: Verify mock generation
              run: |
                  make generate-mocks
                  test -z "$(git status --porcelain -- '*mocks.gen.go')"

            - name: Check for TODOs in PR
              run: |
                  if git diff origin/${{ github.base_ref }}...HEAD | grep -i "TODO\|FIXME\|XXX"; then
                    echo "::warning::Found TODO/FIXME comments in PR"
                  fi

            - name: Run Commitlint
              uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
              with:
                  configFile: .github/commitlint.config.mjs

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
