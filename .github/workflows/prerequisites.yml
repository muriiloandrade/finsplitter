name: Prerequisites Check

on:
    workflow_call:
        inputs:
            go-versions:
                description: "Go versions to check (JSON array)"
                required: false
                default: '["1.26"]'
                type: string

jobs:
    checks:
        name: Prerequisites Check (Go ${{ matrix.go-version }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            matrix:
                go-version: ${{ fromJSON(inputs.go-versions) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: true

            - name: Verify dependencies
              run: go mod verify

            - name: Verify go mod tidy
              run: |
                  go mod tidy
                  test -z "$(git status --porcelain go.mod go.sum)"

            - name: Verify SQLC generation
              run: |
                  make generate-sqlc
                  test -z "$(git status --porcelain internal/gateways/postgres/sqlc/)"

            - name: Verify mock generation
              run: |
                  make generate-mocks
                  test -z "$(git status --porcelain -- '*mocks.gen.go')"

            - name: Check for TODOs in PR
              run: |
                  if git diff origin/${{ github.base_ref }}...HEAD | grep -i "TODO\|FIXME\|XXX"; then
                    echo "::warning::Found TODO/FIXME comments in PR"
                  fi

            - name: Run Commitlint
              uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
              with:
                  configFile: .github/commitlint.config.mjs

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
