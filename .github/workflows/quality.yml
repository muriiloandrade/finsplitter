name: Code Quality

on:
    workflow_call:
        inputs:
            go-versions:
                description: "Go versions to test (JSON array)"
                required: false
                default: '["1.26.1"]'
                type: string
            golangci-lint-version:
                description: "golangci-lint version to use"
                required: false
                default: "v2.4.0"
                type: string
            timeout:
                description: "Timeout for golangci-lint"
                required: false
                default: "10m"
                type: string

jobs:
    quality:
        name: Code Quality (Go ${{ matrix.go-version }})
        runs-on: ubuntu-latest
        permissions:
            contents: read

        strategy:
            matrix:
                go-version: ${{ fromJSON(inputs.go-versions) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: true

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
              with:
                  version: ${{ inputs.golangci-lint-version }}
                  args: --timeout=${{ inputs.timeout }}
