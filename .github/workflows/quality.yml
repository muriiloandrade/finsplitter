name: Code Quality

on:
    workflow_call:
        inputs:
            go-versions:
                description: "Go versions to test (JSON array)"
                required: false
                default: '["1.25.4"]'
                type: string
            golangci-lint-version:
                description: "golangci-lint version to use"
                required: false
                default: "v2.4.0"
                type: string
            timeout:
                description: "Timeout for golangci-lint"
                required: false
                default: "10m"
                type: string

jobs:
    quality:
        name: Code Quality (Go ${{ matrix.go-version }})
        runs-on: ubuntu-latest
        permissions:
            contents: read

        strategy:
            matrix:
                go-version: ${{ fromJSON(inputs.go-versions) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: true

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9
              with:
                  version: ${{ inputs.golangci-lint-version }}
                  args: --timeout=${{ inputs.timeout }}
