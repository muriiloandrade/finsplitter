name: Code Quality

on:
    workflow_call:
        inputs:
            go-versions:
                description: "Go versions to test (JSON array)"
                required: false
                default: '["1.26.1"]'
                type: string
            golangci-lint-version:
                description: "golangci-lint version to use"
                required: false
                default: "v2.4.0"
                type: string
            timeout:
                description: "Timeout for golangci-lint"
                required: false
                default: "10m"
                type: string

jobs:
    quality:
        name: Code Quality (Go ${{ matrix.go-version }})
        runs-on: ubuntu-latest
        permissions:
            contents: read

        strategy:
            matrix:
                go-version: ${{ fromJSON(inputs.go-versions) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: true

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
              with:
                  version: ${{ inputs.golangci-lint-version }}
                  args: --timeout=${{ inputs.timeout }}
