name: Code Quality

on:
    workflow_call:
        inputs:
            go-versions:
                description: "Go versions to test (JSON array)"
                required: false
                default: '["1.26"]'
                type: string
            golangci-lint-version:
                description: "golangci-lint version to use"
                required: false
                default: "v2.4.0"
                type: string
            timeout:
                description: "Timeout for golangci-lint"
                required: false
                default: "10m"
                type: string

jobs:
    quality:
        name: Code Quality (Go ${{ matrix.go-version }})
        runs-on: ubuntu-latest
        permissions:
            contents: read

        strategy:
            matrix:
                go-version: ${{ fromJSON(inputs.go-versions) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: true

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
              env:
                  GOEXPERIMENT: jsonv2
              with:
                  version: ${{ inputs.golangci-lint-version }}
                  args: --timeout=${{ inputs.timeout }}
