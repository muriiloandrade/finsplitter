name: Build

on:
    workflow_call:
        inputs:
            go-versions:
                description: "Go versions to build with (JSON array)"
                required: false
                default: '["1.25.4"]'
                type: string
            binary-name:
                description: "Name of the binary to build"
                required: false
                default: "finsplitter"
                type: string
            main-path:
                description: "Path to the main package"
                required: false
                default: "./cmd/api"
                type: string
            upload-artifact:
                description: "Upload binary as artifact"
                required: false
                default: false
                type: boolean

jobs:
    build:
        name: Build (Go ${{ matrix.go-version }})
        runs-on: ubuntu-latest

        strategy:
            matrix:
                go-version: ${{ fromJSON(inputs.go-versions) }}

        steps:
            - name: Checkout code
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

            - name: Set up Go
              uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: true

            - name: Build application
              run: |
                  CGO_ENABLED=0 go build \
                    -ldflags="-s -w \
                      -X main.BuildCommit=${{ github.sha }} \
                      -X main.BuildTag=${{ github.ref_name }} \
                      -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%S%Z)" \
                    -o ${{ inputs.binary-name }} \
                    ${{ inputs.main-path }}

            - name: Verify binary
              run: |
                  test -f ${{ inputs.binary-name }}
                  ./${{ inputs.binary-name }} --version || echo "Binary built successfully"
