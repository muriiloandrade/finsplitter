name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read

env:
    GO_VERSION: "1.25.4"

jobs:
    quality:
        name: Code Quality
        uses: ./.github/workflows/quality.yml
        with:
            go-versions: '["1.25.4"]'
            golangci-lint-version: "v2.6.1"
            timeout: "10m"

    test:
        name: Test
        uses: ./.github/workflows/test.yml
        with:
            go-versions: '["1.25.4", "1.25.x"]'
            upload-coverage: true

    security:
        name: Security
        uses: ./.github/workflows/security.yml
        with:
            go-versions: '["1.25.4"]'
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read

    build:
        name: Build
        uses: ./.github/workflows/build.yml
        with:
            go-versions: '["1.25.4"]'
            binary-name: "finsplitter"
            main-path: "./cmd/api"

    checks:
        name: Prerequisites Check
        uses: ./.github/workflows/prerequisites.yml
        permissions:
            contents: read
        with:
            go-versions: '["1.25.4"]'

    pr-labeler:
        name: Label Pull Request
        if: github.event_name == 'pull_request'
        uses: ./.github/workflows/release-drafter.yml
        with:
            labeler-only: true
        permissions:
            contents: write
            pull-requests: write

    release-drafter:
        name: Update Release Draft
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [quality, test, build, security, checks]
        uses: ./.github/workflows/release-drafter.yml
        permissions:
            contents: write
            pull-requests: write

    status-check:
        name: CI Status Check
        if: always()
        needs: [quality, test, build, security, checks, release-drafter]
        runs-on: ubuntu-latest

        steps:
            - name: Check all jobs
              run: |
                  if [[ "${{ needs.quality.result }}" == "failure" ]] || \
                     [[ "${{ needs.test.result }}" == "failure" ]] || \
                     [[ "${{ needs.build.result }}" == "failure" ]] || \
                     [[ "${{ needs.security.result }}" == "failure" ]] || \
                     [[ "${{ needs.checks.result }}" == "failure" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                  fi
                  echo "All jobs passed successfully"
