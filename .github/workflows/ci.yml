name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: read
    packages: write

env:
    GO_VERSIONS: '["1.26.x"]'

jobs:
    checks:
        name: Prerequisites Check
        uses: ./.github/workflows/prerequisites.yml
        permissions:
            contents: read
        with:
            go-versions: ${{ env.GO_VERSIONS }}

    quality:
        name: Code Quality
        needs: [checks]
        uses: ./.github/workflows/quality.yml
        with:
            go-versions: ${{ env.GO_VERSIONS }}
            golangci-lint-version: "v2.6.1"
            timeout: "10m"

    test:
        name: Test
        needs: [checks]
        uses: ./.github/workflows/test.yml
        with:
            go-versions: ${{ env.GO_VERSIONS }}
            upload-coverage: true

    security:
        name: Security
        needs: [checks]
        uses: ./.github/workflows/security.yml
        with:
            go-versions: ${{ env.GO_VERSIONS }}
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read

    docker-build:
        name: Docker Build
        if: github.event_name == 'pull_request'
        needs: [quality, test, security, checks]
        uses: ./.github/workflows/docker-build.yml
        with:
            platforms: "linux/amd64"
            push: false
            tags-template: |
                type=ref,event=pr
        permissions:
            contents: read
            packages: write

    pr-labeler:
        name: Label Pull Request
        if: github.event_name == 'pull_request'
        uses: ./.github/workflows/release-drafter.yml
        with:
            labeler-only: true
        permissions:
            contents: write
            pull-requests: write

    release-drafter:
        name: Update Release Draft
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [quality, test, security, checks]
        uses: ./.github/workflows/release-drafter.yml
        permissions:
            contents: write
            pull-requests: write

    status-check:
        name: CI Status Check
        if: always()
        needs: [quality, test, security, checks, docker-build, release-drafter]
        runs-on: ubuntu-latest

        steps:
            - name: Check all jobs
              run: |
                  if [[ "${{ needs.quality.result }}" == "failure" ]] || \
                     [[ "${{ needs.test.result }}" == "failure" ]] || \
                     [[ "${{ needs.security.result }}" == "failure" ]] || \
                     [[ "${{ needs.checks.result }}" == "failure" ]] || \
                     [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                  fi
                  echo "All jobs passed successfully"
