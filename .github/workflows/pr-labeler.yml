name: PR Labeler

on:
    workflow_call:

permissions:
    contents: read
    pull-requests: write

jobs:
    auto_label_pr:
        name: Auto Label PR
        runs-on: ubuntu-latest
        steps:
            - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
