name: PR Labeler

on:
    workflow_call:

permissions:
    contents: read
    pull-requests: write

jobs:
    auto_label_pr:
        name: Auto Label PR
        runs-on: ubuntu-latest
        steps:
            - uses: release-drafter/release-drafter/autolabeler@563bf132657a13ded0b01fcb723c5a58cdd824e2 # v7.2.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
