name: PR Labeler

on:
    workflow_call:

permissions:
    contents: read
    pull-requests: write

jobs:
    auto_label_pr:
        name: Auto Label PR
        runs-on: ubuntu-latest
        steps:
            - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
