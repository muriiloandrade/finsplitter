name: Docker Build

on:
    workflow_call:
        inputs:
            platforms:
                description: "Target platforms for the build"
                required: false
                default: "linux/amd64"
                type: string
            push:
                description: "Whether to push the image"
                required: false
                default: false
                type: boolean
            tags-template:
                description: "Tags template for metadata extraction"
                required: false
                default: |
                    type=ref,event=branch
                    type=ref,event=pr
                type: string
            enable-sbom:
                description: "Enable SBOM generation"
                required: false
                default: false
                type: boolean
            enable-provenance:
                description: "Enable provenance generation"
                required: false
                default: false
                type: boolean
        outputs:
            image:
                description: "Built image name"
                value: ${{ jobs.build.outputs.image }}
            digest:
                description: "Image digest"
                value: ${{ jobs.build.outputs.digest }}
            metadata:
                description: "Build metadata"
                value: ${{ jobs.build.outputs.metadata }}

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            image: ${{ steps.image.outputs.image }}
            digest: ${{ steps.build.outputs.digest }}
            metadata: ${{ steps.meta.outputs.json }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Log in to Container Registry
              if: inputs.push
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Get current timestamp
              id: timestamp
              run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: ${{ inputs.tags-template }}
                  labels: |
                      org.opencontainers.image.title=${{ github.event.repository.name }}
                      org.opencontainers.image.description=${{ github.event.repository.description }}
                      org.opencontainers.image.url=${{ github.event.repository.html_url }}
                      org.opencontainers.image.source=${{ github.event.repository.clone_url }}
                      org.opencontainers.image.version=${{ github.ref_name }}
                      org.opencontainers.image.created=${{ steps.timestamp.outputs.build_time }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}

            - name: Set image output
              id: image
              run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

            - name: Build and push Docker image
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  platforms: ${{ inputs.platforms }}
                  push: ${{ inputs.push }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      GIT_COMMIT=${{ github.sha }}
                      GIT_BUILD_TAG=${{ github.ref_name }}
                      BUILD_TIME=${{ steps.timestamp.outputs.build_time }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  sbom: ${{ inputs.enable-sbom }}
                  provenance: ${{ inputs.enable-provenance }}
