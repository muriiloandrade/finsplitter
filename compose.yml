---
include:
  - compose.infra.yml

services:
  api:
    image: finsplitter:dev
    container_name: finsplitter
    profiles:
      - backend
    build:
      context: .
      dockerfile: ./Dockerfile
      target: setup
    ports:
      - "${PORT}:${PORT}"
    command: go run cmd/api/main.go
    develop:
      watch:
        - path: ./
          target: /app
          action: sync+restart
    networks:
      - finsplitter

networks:
  finsplitter:
    name: finsplitter-net