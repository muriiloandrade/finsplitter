version: "2"
sql:
  - schema: "internal/gateways/postgres/migrations"
    queries: "internal/gateways/postgres/sqlc/queries"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "internal/gateways/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_exported_queries: true
        emit_pointers_for_null_types: true
        emit_prepared_queries: true
        emit_json_tags: true
        emit_db_tags: true
        json_tags_case_style: camel
        query_parameter_limit: 0
        overrides:
          - go_type: "encoding/json.RawMessage"
            db_type: "jsonb"
          - go_type:
              import: "github.com/gofrs/uuid/v5"
              package: "uuid"
              type: "UUID"
            db_type: "uuid"
          - go_type:
              import: "github.com/gofrs/uuid/v5"
              package: "uuid"
              type: "UUID"
            db_type: "uuid"
            nullable: true
          - go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true
            db_type: "pg_catalog.numeric"
          - go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true
            db_type: "pg_catalog.numeric"
            nullable: true
